name: Voix off (TTS)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "engine/tts.py (reels) ou engine/tts_ep.py (épisodes)"
        required: false
        default: "engine/tts.py"
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Kokoro
        run: |
          pip install kokoro-onnx soundfile
          curl -sSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Générer
        run: python ${{ github.event.inputs.script || 'engine/tts.py' }}
      - name: Commit
        run: |
          git config user.name "ig-publisher"; git config user.email "ig-publisher@users.noreply.github.com"
          git add audio; git commit -m "Voix off générées" || exit 0
          git pull --rebase -q; git push
