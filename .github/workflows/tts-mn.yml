name: Voix mongole (présentation QG)
on:
  push:
    branches: [tts-mn]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - name: Générer
        run: |
          mkdir -p out
          i=0
          while IFS= read -r line; do i=$((i+1)); for v in mn-MN-YesuiNeural mn-MN-BataaNeural; do edge-tts --voice "$v" --rate=+4% --text "$line" --write-media "out/${v}_$i.mp3"; done; done < segments.txt
          ls -la out
      - name: Enregistrer sur la branche
        if: ${{ !contains(github.event.head_commit.message, '[voix]') }}
        run: |
          git config user.name "tts-bot"; git config user.email "tts-bot@users.noreply.github.com"
          git add out; git commit -m "[voix] fichiers générés" || exit 0
          git push
