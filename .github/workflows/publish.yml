name: Publication Instagram

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 19:00 Séoul
  workflow_dispatch:
    inputs:
      decks:
        description: "Decks à publier maintenant (ex. 0-4). Vide = posts du jour."
        required: false
        default: ""
      account:
        description: "kobi, dari ou vide (les deux)"
        required: false
        default: ""
      dry_run:
        description: "true = simulation sans publier"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publier
        env:
          IG_TOKEN_KOBI: ${{ secrets.IG_TOKEN_KOBI }}
          IG_TOKEN_DARI: ${{ secrets.IG_TOKEN_DARI }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.decks }}" ]; then ARGS="--decks ${{ github.event.inputs.decks }}"; else ARGS="--today"; fi
          if [ -n "${{ github.event.inputs.account }}" ]; then ARGS="$ARGS --account ${{ github.event.inputs.account }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python publish.py $ARGS
      - name: Sauvegarder l'état
        if: always()
        run: |
          git config user.name "ig-publisher"
          git config user.email "ig-publisher@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state: posts publiés" && git push)
