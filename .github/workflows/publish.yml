name: Publication Instagram

on:
  schedule:
    - cron: "2,32 * * * *"   # toutes les 30 min ; le script publie ce qui est dû
  workflow_dispatch:
    inputs:
      key:
        description: "Forcer un élément (ex. kobi:c:00_launch). Vide = file d'attente."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publier
        env:
          IG_TOKEN_KOBI: ${{ secrets.IG_TOKEN_KOBI }}
          IG_TOKEN_DARI: ${{ secrets.IG_TOKEN_DARI }}
        run: |
          if [ -n "${{ github.event.inputs.key }}" ]; then python publish.py --key "${{ github.event.inputs.key }}"; else python publish.py; fi
      - name: Sauvegarder l'état
        if: always()
        run: |
          git config user.name "ig-publisher"
          git config user.email "ig-publisher@users.noreply.github.com"
          git add state2.json || true
          git diff --cached --quiet && exit 0
          git commit -m "state: publications"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
