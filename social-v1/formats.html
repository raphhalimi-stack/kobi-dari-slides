<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Formats V1</title>
<style>
@font-face{font-family:Newsreader;src:url(../engine/fonts/NewsreaderItalic.ttf);font-style:italic}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Inter,'Noto Sans CJK KR','Noto Sans CJK JP',sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.emo{font-family:'Noto Color Emoji'}
/* ===== KOBI : studio crème, rose poudré, encre cacao, serif éditorial ===== */
.kobi{background:radial-gradient(1200px 900px at 70% 18%,#fff7f1 0,#f6ece3 45%,#efdfd3 100%);color:#2b1f1a}
.kobi .brand{position:absolute;top:70px;left:70px;display:flex;gap:18px;align-items:center;font:700 30px Inter;letter-spacing:.18em;text-transform:uppercase;color:#7a5a4c}
.kobi .brand i{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#f3c6bb,#e59f8f);display:block;position:relative}
.kobi .brand i:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#2b1f1a;right:9px;bottom:9px}
.kobi .serie{position:absolute;top:66px;right:70px;font:italic 40px Newsreader;color:#b0705f}
.kobi h1{font:800 104px/1.0 'Inter Display',Inter;letter-spacing:-.035em}
.kobi h1 em{font:italic 112px/1 Newsreader;color:#c0624f;letter-spacing:-.01em}
.kobi .sub{font:500 46px/1.3 Inter;color:#6b5247}
.chip{display:inline-flex;align-items:center;gap:14px;padding:22px 34px;border-radius:999px;font:700 40px Inter;background:#fff;box-shadow:0 12px 40px rgba(90,50,30,.12)}
.ok{color:#2f7d5b}.watch{color:#c0624f}
/* produits */
.bottle{position:absolute;border-radius:60px 60px 46px 46px;box-shadow:inset -30px 0 60px rgba(0,0,0,.08),inset 26px 0 40px rgba(255,255,255,.6),0 60px 90px rgba(90,50,30,.25)}
.cap{position:absolute;border-radius:24px 24px 10px 10px}
.label{position:absolute;left:12%;right:12%;border-radius:18px;background:rgba(255,255,255,.88);text-align:center;padding:26px 10px;font:800 44px Inter;letter-spacing:.06em;color:#2b1f1a}
.label small{display:block;font:600 26px Inter;letter-spacing:.2em;color:#9a7b6d;margin-top:8px}
.shine{position:absolute;top:6%;left:16%;width:12%;height:70%;border-radius:40px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.laser{position:absolute;left:150px;right:150px;height:10px;border-radius:10px;background:#ff5a6e;box-shadow:0 0 30px 10px rgba(255,90,110,.55),0 0 90px 30px rgba(255,90,110,.25)}
.ring{position:absolute;width:300px;height:300px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#2f7d5b var(--p),#eadbd0 0);box-shadow:0 20px 60px rgba(90,50,30,.2)}
.ring b{width:236px;height:236px;border-radius:50%;background:#fff8f3;display:grid;place-items:center;font:900 96px 'Inter Display',Inter;color:#2b1f1a}
.ring b small{font:600 26px Inter;color:#9a7b6d;display:block;margin-top:-30px}
.price{position:absolute;padding:18px 30px;border-radius:20px;background:#2b1f1a;color:#fff7f1;font:800 50px Inter;transform:rotate(-6deg);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.cta{position:absolute;left:70px;right:70px;bottom:130px;padding:40px;border-radius:40px;background:#2b1f1a;color:#fff7f1;font:700 46px Inter;text-align:center}
.cta em{font:italic 54px Newsreader;color:#f3c6bb}
/* ===== DARI : nuit de Séoul, marine profond, corail, lignes de métro ===== */
.dari{background:#081633;color:#fff}
.dari:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 15% 10%,rgba(255,107,87,.35),transparent 60%),radial-gradient(900px 900px at 100% 85%,rgba(46,124,255,.35),transparent 60%)}
.dari .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px);background-size:90px 90px}
.dari .brand{position:absolute;top:70px;left:70px;font:900 36px 'Inter Display',Inter;letter-spacing:.06em;color:#ff6b57;display:flex;gap:14px;align-items:center;z-index:3}
.dari .brand i{width:46px;height:28px;border:7px solid #ff6b57;border-bottom:none;border-radius:40px 40px 0 0;display:block}
.dari .serie{position:absolute;top:66px;right:70px;padding:12px 24px;border-radius:999px;background:#ff6b57;color:#081633;font:900 30px Inter;letter-spacing:.08em;z-index:3}
.dari h1{font:900 118px/.95 'Inter Display',Inter;letter-spacing:-.04em;text-transform:uppercase}
.dari h1 span{color:#ff6b57}
.dari .sub{font:600 46px/1.3 Inter;color:#b9c6e4}
.receipt{position:absolute;left:150px;right:150px;background:#fbf7ef;color:#1b1b1b;border-radius:10px 10px 0 0;padding:50px 54px 40px;font:600 44px 'DejaVu Sans Mono',monospace;box-shadow:0 50px 100px rgba(0,0,0,.5)}
.receipt:after{content:"";position:absolute;left:0;right:0;bottom:-30px;height:30px;background:linear-gradient(-45deg,transparent 15px,#fbf7ef 0) 0 0/30px 30px,linear-gradient(45deg,transparent 15px,#fbf7ef 0) 0 0/30px 30px}
.receipt .row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:3px dashed #d8cfbf}
.receipt .row .emo{font-size:64px;margin-right:18px}
.receipt .tot{display:flex;justify-content:space-between;font:900 60px Inter;padding-top:26px}
.counter{position:absolute;left:0;right:0;text-align:center;font:900 190px 'Inter Display',Inter;letter-spacing:-.05em;color:#ffd166;text-shadow:0 0 60px rgba(255,209,102,.45)}
.stamp{position:absolute;width:520px;height:520px;border:34px solid #ff3b3b;border-radius:50%;display:grid;place-items:center;color:#ff3b3b;font:900 300px Inter;transform:rotate(-14deg);box-shadow:0 0 80px rgba(255,59,59,.5),inset 0 0 60px rgba(255,59,59,.4)}
.line2{position:absolute;border:26px solid #00a84d;border-radius:50%;box-shadow:0 0 50px rgba(0,168,77,.5)}
.st{position:absolute;display:flex;align-items:center;gap:22px;font:800 48px Inter;white-space:nowrap}
.st i{width:56px;height:56px;border-radius:50%;background:#fff;border:12px solid #00a84d;display:block;box-shadow:0 0 0 10px rgba(255,107,87,.0)}
.st.hot i{border-color:#ff6b57;box-shadow:0 0 0 16px rgba(255,107,87,.25),0 0 60px rgba(255,107,87,.8)}
.st small{display:block;font:600 32px Inter;color:#b9c6e4}
.pill{display:inline-block;padding:16px 30px;border-radius:999px;font:800 40px Inter}
.dcta{position:absolute;left:70px;right:70px;bottom:130px;padding:40px;border-radius:36px;background:#ff6b57;color:#081633;font:900 50px Inter;text-align:center}
.safe{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,rgba(0,0,0,.0))}
</style></head>
<body><div id="root"></div>
<script>
const P=new URLSearchParams(location.search), F=P.get('f')||'K1', S=+(P.get('s')||0), T=+(P.get('t')||1);
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3), lerp=(a,b,x)=>a+(b-a)*ease(x);
const K=(serie,body)=>`<div class="stage kobi"><div class="brand"><i></i>Kobi</div><div class="serie">${serie}</div>${body}</div>`;
const D=(serie,body)=>`<div class="stage dari"><div class="grid"></div><div class="brand"><i></i>DARI</div><div class="serie">${serie}</div>${body}</div>`;

const scenes={
 K1:[ t=>K('Scan it · Ep.1',`

 K3:[ t=>K('Label X-ray',`

  t=>K('Label X-ray',`
   <div style="position:absolute;top:240px;left:70px;right:70px"><h1>Point. <em>Scan.</em> Understand.</h1><p class="sub" style="margin-top:30px">Save this for your next Olive Young run.</p></div><div style="position:absolute;left:330px;top:720px;width:420px;height:760px;border-radius:70px;background:#2b1f1a;padding:22px;box-shadow:0 60px 100px rgba(90,50,30,.35)"><div style="width:100%;height:100%;border-radius:52px;background:linear-gradient(180deg,#fff8f3,#f3e3d8);padding:60px 36px;font:700 34px Inter;color:#2b1f1a"><div style="font:italic 44px Newsreader;color:#c0624f">Kobi</div><div style="margin-top:30px;height:200px;border-radius:30px;background:#e8f1ec;display:grid;place-items:center;font:900 70px 'Noto Sans CJK KR','Noto Sans CJK JP'">진정</div><div style="margin-top:26px;font:italic 50px Newsreader;color:#2f7d5b">= soothing</div><div style="margin-top:26px;height:18px;border-radius:9px;background:#eadbd0"></div><div style="margin-top:14px;height:18px;width:70%;border-radius:9px;background:#eadbd0"></div></div></div>
   <div class="cta">Every Korean label, translated<br><em>Kobi · 25 Nov</em></div>`)],
 D1:[ t=>D('Seoul for ₩10,000',`
   <div style="position:absolute;top:200px;left:70px;right:70px;z-index:2"><h1>What <span>₩10,000</span> gets you in Myeongdong</h1></div>
   <div class="counter" style="top:720px">₩${Math.round(lerp(0,3500,T)).toLocaleString('en')}</div>

     <div style="position:absolute;left:620px;top:250px;width:200px;height:300px;border-radius:30px;background:#7b8aa3"></div></div>
   <div class="stamp" style="left:280px;top:${lerp(600,880,T)}px;opacity:${T>0.4?1:0}">✕</div>`),
  t=>D("Don't do this",`
   <div style="position:absolute;top:220px;left:70px;right:70px"><h1>The <span>pink seat</span> is not a free seat.</h1></div>

 D3:[ t=>D('Line 2 secrets',`
   <div style="position:absolute;top:200px;left:70px;right:70px;z-index:2"><h1>Skip Hongdae. <span>Get off here</span> instead.</h1></div>
   <div class="line2" style="left:140px;top:${lerp(900,760,T)}px;width:800px;height:800px"></div>
   <div class="st hot" style="left:780px;top:880px"><i></i></div>
   <div class="st" style="left:150px;top:1110px"><i></i></div>

  t=>D('Line 2 secrets',`
   <div style="position:absolute;top:200px;left:70px;right:70px"><h1>3 stops <span>locals</span> love</h1></div>
   <div class="line2" style="left:-300px;top:620px;width:900px;height:900px"></div>
   <div class="st hot" style="left:480px;top:700px;opacity:${T>.1?1:.2}"><i></i><span>Seongsu<small>cafés in old factories</small></span></div>
